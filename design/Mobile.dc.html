    <div style="width:34px;height:34px;border-radius:999px;background:#c98a4e;color:#2a2118;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;">NO</div>

    </div>

    <div style="align-self:flex-end;max-width:300px;background:#a64f26;color:#fff7ee;border-radius:16px 16px 5px 16px;padding:10px 13px;font-size:14px;line-height:1.45;">oh that's the one 😍 — did the timelapse survive?</div>

    <div style="align-self:flex-start;position:relative;background:#ffffff;border:1px solid #e9e0cf;border-radius:16px;padding:5px;margin-bottom:10px;">

      <div style="display:flex;align-items:center;gap:8px;padding:6px 5px 3px 5px;">
        <span style="flex:1;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;color:#776f5e;">sunrise-timelapse.mp4</span>
        <span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;color:#a49a88;">18.2 MB</span>

    <div style="flex:1;display:flex;align-items:center;background:#ffffff;border:1px solid #e7dece;border-radius:14px;padding:0 14px;height:44px;">

        <path d="M12 19V6M6 12l6-6 6 6"/>
      </svg>

  <div style="flex-shrink:0;background:#ffffff;border-top:1px solid #e9e0cf;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(60,40,20,0.08);padding:8px 14px 20px 14px;display:flex;flex-direction:column;gap:10px;">

    <div style="display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:2px;">
