name: tincan
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.2+6

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^4.2.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  image: ^4.9.2
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  qr: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/logo-mono.svg
  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
